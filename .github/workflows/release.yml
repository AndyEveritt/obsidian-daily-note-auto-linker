name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          manifest_version="$(node -p \"require('./manifest.json').version\")"
          if [[ "$TAG_NAME" != "$manifest_version" ]]; then
            echo "Tag $TAG_NAME does not match manifest version $manifest_version." >&2
            exit 1
          fi

          ref_type="$(gh api "repos/$REPO/git/ref/tags/$TAG_NAME" --jq '.object.type')"
          ref_sha="$(gh api "repos/$REPO/git/ref/tags/$TAG_NAME" --jq '.object.sha')"

          if [[ "$ref_type" != "tag" ]]; then
            echo "Tag $TAG_NAME is a lightweight tag. Create a signed annotated tag so GitHub can verify it." >&2
            exit 1
          fi

          verified="$(gh api "repos/$REPO/git/tags/$ref_sha" --jq '.verification.verified')"
          reason="$(gh api "repos/$REPO/git/tags/$ref_sha" --jq '.verification.reason')"

          if [[ "$verified" != "true" ]]; then
            echo "Tag $TAG_NAME is not GitHub-verified. Verification reason: $reason" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          cp manifest.json main.js release-assets/

          if [[ -f styles.css ]]; then
            cp styles.css release-assets/
          fi

      - name: Generate release notes from commits
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"

          {
            echo "## Changes"
            echo

            if [[ -n "$previous_tag" ]]; then
              echo "Changes since $previous_tag."
              echo
              git log "${previous_tag}..${TAG_NAME}" --no-merges --pretty='- %s (%h)'
            else
              echo "Initial release."
              echo
              git log "$TAG_NAME" --no-merges --pretty='- %s (%h)'
            fi
          } > RELEASE_NOTES.md

          if ! grep -q '^- ' RELEASE_NOTES.md; then
            echo "- No commit subjects were found for this release." >> RELEASE_NOTES.md
          fi

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          assets=(
            release-assets/manifest.json
            release-assets/main.js
          )

          if [[ -f release-assets/styles.css ]]; then
            assets+=(release-assets/styles.css)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file RELEASE_NOTES.md \
              "${assets[@]}"
          fi
